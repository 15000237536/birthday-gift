<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3f0" />
    <title>Birthday</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="site">
      <section id="coverPage" class="cover" aria-label="生日网站首页">
        <div class="cover__backdrop" aria-hidden="true"></div>

        <div class="cover__portrait" aria-hidden="true">
          <img
            class="cover__image"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__gleam cover__gleam--nineteen"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__gleam cover__gleam--greeting"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__star cover__star--corner"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__star cover__star--shooting"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__star cover__star--cluster"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
        </div>

        <div class="cover__bottom-fade" aria-hidden="true"></div>

        <button id="startButton" class="start-button" type="button">
          <span class="start-button__rule" aria-hidden="true"></span>
          <span class="start-button__label">START</span>
          <span class="start-button__rule" aria-hidden="true"></span>
        </button>
      </section>

      <section id="nextPage" class="next-page" aria-label="下一页" hidden>
        <button id="backButton" class="back-button" type="button" aria-label="返回第一页">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
        </button>

        <div class="next-page__constellation" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
