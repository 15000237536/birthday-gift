<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3f0" />
    <title>Birthday</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="site">
      <section id="coverPage" class="cover" aria-label="生日网站首页">
        <div class="cover__backdrop" aria-hidden="true"></div>

        <div class="cover__portrait" aria-hidden="true">
          <img
            class="cover__image"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__gleam cover__gleam--nineteen"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__gleam cover__gleam--greeting"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__star cover__star--corner"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__star cover__star--shooting"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
          <img
            class="cover__star cover__star--cluster"
            src="./assets/birthday-cover.jpg"
            alt=""
            draggable="false"
          />
        </div>

        <div class="cover__bottom-fade" aria-hidden="true"></div>

        <button id="startButton" class="start-button" type="button">
          <span class="start-button__rule" aria-hidden="true"></span>
          <span class="start-button__label">START</span>
          <span class="start-button__rule" aria-hidden="true"></span>
        </button>
      </section>

      <section id="nextPage" class="next-page" aria-label="我们的旅行地图" hidden>
        <button id="backButton" class="back-button" type="button" aria-label="返回第一页">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
        </button>

        <div class="journey-background" aria-hidden="true"></div>

        <div class="journey-atmosphere" aria-hidden="true">
          <span class="journey-atmosphere__glow journey-atmosphere__glow--blue"></span>
          <span class="journey-atmosphere__glow journey-atmosphere__glow--rose"></span>
          <span class="journey-atmosphere__beam"></span>
        </div>

        <div class="journey-counter" aria-label="四个城市，十七个回忆">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2v20M3.3 6.8l17.4 10.4M20.7 6.8 3.3 17.2"></path>
            <path d="m12 5-2.4-2.2M12 5l2.4-2.2M12 19l-2.4 2.2M12 19l2.4 2.2"></path>
          </svg>
          <strong id="photoCount">17</strong>
          <span>MEMORIES</span>
        </div>

        <header class="journey-header">
          <p class="journey-header__eyebrow">OUR LITTLE PLANET</p>
          <h1>一起去过的地方</h1>
          <p class="journey-header__copy"><span>把走过的城市收进这颗小小星球，</span><span>每一处都藏着我们的回忆。</span></p>
        </header>

        <div class="journey-map">
          <div class="journey-map__paper" aria-hidden="true"></div>

          <svg
            class="journey-map__land"
            viewBox="0 0 1200 820"
            preserveAspectRatio="xMidYMid meet"
            aria-hidden="true"
          >
            <defs>
              <radialGradient id="globe-wash" cx="38%" cy="28%" r="78%">
                <stop offset="0" stop-color="#d8f1ff"></stop>
                <stop offset="0.38" stop-color="#78c2ec"></stop>
                <stop offset="0.72" stop-color="#3579b6"></stop>
                <stop offset="1" stop-color="#143b72"></stop>
              </radialGradient>
              <linearGradient id="globe-land" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e4f7ff"></stop>
                <stop offset="0.5" stop-color="#8bd2ef"></stop>
                <stop offset="1" stop-color="#4d91c2"></stop>
              </linearGradient>
              <radialGradient id="planet-aura">
                <stop offset="0.52" stop-color="#9adfff" stop-opacity="0.34"></stop>
                <stop offset="0.72" stop-color="#8eb9ff" stop-opacity="0.2"></stop>
                <stop offset="1" stop-color="#b7ccff" stop-opacity="0"></stop>
              </radialGradient>
              <clipPath id="globe-clip">
                <circle cx="600" cy="405" r="330"></circle>
              </clipPath>
              <filter id="globe-soft-glow" x="-45%" y="-45%" width="190%" height="190%">
                <feGaussianBlur stdDeviation="14"></feGaussianBlur>
              </filter>
              <filter id="marker-glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
                <feMerge>
                  <feMergeNode in="blur"></feMergeNode>
                  <feMergeNode in="SourceGraphic"></feMergeNode>
                </feMerge>
              </filter>
            </defs>

            <ellipse class="journey-map__planet-shadow" cx="600" cy="740" rx="284" ry="36"></ellipse>
            <circle class="journey-map__planet-aura" cx="600" cy="405" r="398"></circle>
            <circle
              class="journey-map__planet-glow"
              cx="600"
              cy="405"
              r="358"
              filter="url(#globe-soft-glow)"
            ></circle>

            <g clip-path="url(#globe-clip)">
              <circle class="journey-map__globe" cx="600" cy="405" r="330"></circle>

              <g class="journey-map__sphere-surface">
                <g transform="translate(600 405) scale(1.065) translate(-600 -405)">
                  <g class="journey-map__sphere-spin">
                    <g class="journey-map__landmass" transform="translate(175 100) scale(0.64)">
                      <path
                        d="M209 201C272 156 330 157 384 132C438 108 486 81 541 104C587 123 612 91 661 111C714 132 731 180 782 190C832 199 888 180 934 216C979 251 965 302 1002 336C1037 369 1079 399 1062 455C1047 504 988 488 951 529C912 572 877 598 829 590C779 581 749 626 698 642C646 658 593 627 541 648C488 669 430 651 384 619C339 587 288 578 264 530C241 484 199 456 205 405C211 355 168 321 170 278C172 239 181 218 209 201Z"
                      ></path>
                      <path
                        class="journey-map__landmass-small"
                        d="M1050 610C1081 589 1117 610 1108 641C1097 676 1054 676 1034 651C1021 634 1032 621 1050 610Z"
                      ></path>
                    </g>

                    <path
                      class="journey-map__cloud"
                      d="M318 272C378 228 443 246 487 292C531 336 600 310 652 332C705 354 747 401 724 445C700 491 627 480 570 496C513 512 449 530 392 496C334 462 282 410 296 350C301 325 306 293 318 272Z"
                    ></path>
                    <path
                      class="journey-map__cloud journey-map__cloud--two"
                      d="M607 553C662 522 729 543 757 590C784 636 750 688 698 702C646 716 577 694 555 647C536 606 565 576 607 553Z"
                    ></path>
                  </g>

                  <ellipse class="journey-map__globe-shine" cx="484" cy="265" rx="126" ry="92"></ellipse>
                  <ellipse class="journey-map__globe-shine journey-map__globe-shine--small" cx="547" cy="207" rx="48" ry="27"></ellipse>
                </g>
              </g>
              <ellipse class="journey-map__globe-shade" cx="671" cy="513" rx="216" ry="181"></ellipse>
            </g>

            <circle class="journey-map__globe-outline" cx="600" cy="405" r="330"></circle>
            <ellipse class="journey-map__orbit" cx="600" cy="415" rx="376" ry="104"></ellipse>
            <path class="journey-map__orbit-tick" d="M230 417h26M944 417h26"></path>

            <path
              class="journey-map__route-shadow"
              d="M779 323C748 327 718 338 742 359C763 378 769 382 794 399C814 423 817 493 830 548"
            ></path>
            <path
              class="journey-map__route"
              d="M779 323C748 327 718 338 742 359C763 378 769 382 794 399C814 423 817 493 830 548"
            ></path>

            <g class="journey-map__sparkles" filter="url(#marker-glow)">
              <circle cx="266" cy="212" r="3"></circle>
              <circle cx="331" cy="567" r="2.4"></circle>
              <circle cx="900" cy="229" r="3.4"></circle>
              <circle cx="963" cy="516" r="2.2"></circle>
              <circle cx="672" cy="115" r="2.3"></circle>
              <circle cx="812" cy="671" r="2.8"></circle>
            </g>
          </svg>

          <div id="cityLayer" class="journey-map__cities" aria-label="旅行城市"></div>

          <div class="journey-map__legend" aria-hidden="true">
            <span class="journey-map__legend-line"></span>
            <span>4 CITIES · 17 MOMENTS</span>
          </div>
        </div>

        <p class="journey-hint">
          <span class="journey-hint__spark" aria-hidden="true"></span>
          点击城市，打开我们的回忆
        </p>

        <div class="journey-continue" aria-hidden="true">
          <span>CONTINUE</span>
          <svg viewBox="0 0 34 16">
            <path d="M2 8h27"></path>
            <path d="m23 2 6 6-6 6"></path>
          </svg>
        </div>

        <dialog id="memoryDialog" class="memory-dialog" aria-labelledby="memoryTitle">
          <div class="memory-dialog__scrim" data-close-dialog></div>
          <article class="memory">
            <button class="memory__close" type="button" data-close-dialog aria-label="关闭回忆">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18"></path>
              </svg>
            </button>

            <div class="memory__media">
              <div id="memorySlides" class="memory__slides"></div>
              <button class="memory__arrow memory__arrow--prev" type="button" data-slide="-1" aria-label="上一张照片">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m15 18-6-6 6-6"></path>
                </svg>
              </button>
              <button class="memory__arrow memory__arrow--next" type="button" data-slide="1" aria-label="下一张照片">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 18 6-6-6-6"></path>
                </svg>
              </button>
              <p id="memoryCounter" class="memory__counter"></p>
            </div>

            <div class="memory__copy">
              <p id="memoryMeta" class="memory__meta"></p>
              <h2 id="memoryTitle"></h2>
              <p id="memoryDate" class="memory__date"></p>
              <p id="memoryNote" class="memory__note"></p>
              <div id="memoryTags" class="memory__tags"></div>
              <div id="memoryDots" class="memory__dots" aria-hidden="true"></div>
            </div>
          </article>
        </dialog>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
